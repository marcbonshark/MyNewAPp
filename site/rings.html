<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>elev8 · BMI, FFMI and body fat</title>
<meta name="description" content="Close the gap between weight and what it's made of: BMI, FFMI and body fat as three rings.">
<link rel="stylesheet" href="css/organic.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="rg">

<header>
  <nav class="nav site-nav wrap" aria-label="Main">
    <a class="nav-brand" href="index.html">
      <svg class="logo" width="46" height="24" viewBox="0 0 100 50" aria-hidden="true"><path class="logo-ink" d="M50 25C38 6 10 6 10 25S38 44 50 25 90 6 90 25 62 44 50 25Z"/><path class="logo-fill" d="M50 25C38 6 10 6 10 25S38 44 50 25 90 6 90 25 62 44 50 25Z"/><path class="logo-hi" d="M18 20C22 13 30 12 36 15"/><path class="logo-hi" d="M64 15C70 12 78 13 82 20"/></svg>
      <span>elev8</span>
    </a>
    <a class="nav-link" href="#" aria-current="page">Calculator</a>
    <a class="nav-link" href="#">Science</a>
    <a class="nav-link" href="#">App</a>
    <a class="btn btn-primary" href="#">Get the app</a>
  </nav>
</header>

<main class="wrap">
  <section class="rg-title">
    <h1>Close the gap between weight and what it's made of.</h1>
  </section>

  <section class="rg-body">
    <div class="rg-rings" role="img" aria-label="Rings for BMI, FFMI and body fat">
      <svg viewBox="0 0 460 460" aria-hidden="true">
        <circle cx="230" cy="230" r="200" stroke="var(--color-accent-800)"/>
        <circle class="arc" cx="230" cy="230" r="200" stroke="var(--color-accent-500)" stroke-dasharray="1256.6" data-attr="stroke-dashoffset=ringBmi"/>
        <circle cx="230" cy="230" r="158" stroke="var(--color-accent-2-700)"/>
        <circle class="arc" cx="230" cy="230" r="158" stroke="var(--color-accent-2-400)" stroke-dasharray="992.7" data-attr="stroke-dashoffset=ringFfmi"/>
        <circle cx="230" cy="230" r="116" stroke="var(--color-neutral-800)"/>
        <circle class="arc" cx="230" cy="230" r="116" stroke="var(--color-neutral-300)" stroke-dasharray="728.8" data-attr="stroke-dashoffset=ringBf"/>
      </svg>
      <div class="rg-center"><span class="num" data-text="bmi"></span><small>BMI</small></div>
    </div>

    <div class="rg-side">
      <div class="rg-stats" aria-live="polite">
        <div class="rg-stat"><span class="k-bmi">BMI</span><span class="num" data-text="bmi"></span><span data-text="bmiCat"></span></div>
        <div class="rg-stat"><span>FFMI</span><span class="num" data-text="ffmi"></span><span data-text="ffmiCat"></span></div>
        <div class="rg-stat"><span class="k-bf">Body fat</span><span class="num" data-text="bfLabel"></span><span><span data-text="fatLabel"></span> fat mass</span></div>
      </div>

      <form class="rg-panel" onsubmit="return false" aria-label="Your stats">
        <div class="rg-panel-head">
          <span class="title">Your stats</span>
          <div class="seg" role="radiogroup" aria-label="Units">
            <label class="seg-opt"><input type="radio" name="unit" data-unit="metric">Metric</label>
            <label class="seg-opt"><input type="radio" name="unit" data-unit="imperial">Imperial</label>
          </div>
        </div>
        <div class="rg-row"><label for="h">Height</label><input id="h" type="range" min="140" max="220" data-input="heightCm" style="--range:var(--color-accent-2-400)"><strong data-text="heightLabel"></strong></div>
        <div class="rg-row"><label for="w">Weight</label><input id="w" type="range" min="40" max="160" data-input="weightKg" style="--range:var(--color-accent-400)"><strong data-text="weightLabel"></strong></div>
        <div class="rg-row"><label for="bf">Body fat</label><input id="bf" type="range" min="4" max="35" data-input="bf" style="--range:var(--color-neutral-300)"><strong data-text="bfLabel"></strong></div>
      </form>

      <p class="rg-verdict" data-text="verdict" aria-live="polite"></p>
    </div>
  </section>
</main>

<script src="js/bmi.js"></script>
<script>Elev8.mount(document);</script>
</body>
</html>
